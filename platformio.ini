; ESP32-S3-DevKitC-1 (N16R8: 16 MB QIO flash, 8 MB octal PSRAM) + GY-271

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N16R8 memory layout
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
; On the native USB port the default RTS "hard reset" can leave the chip in
; download mode; a watchdog reset always starts the new firmware.
board_upload.after_reset = watchdog_reset

build_flags =
    -DBOARD_HAS_PSRAM
    ; Serial = native "USB" port (USB CDC), Serial0 = "UART"/"COM" port.
    ; The firmware writes to both, so either connector works.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
